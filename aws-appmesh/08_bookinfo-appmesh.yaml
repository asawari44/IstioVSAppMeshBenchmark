##################################################################################################
# This file defines the services, service accounts, and deployments for the Bookinfo sample.
#
# To apply all 4 Bookinfo services, their corresponding service accounts, and deployments:
#
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml
#
# Alternatively, you can deploy any resource separately:
#
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml -l service=reviews # reviews Service
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml -l account=reviews # reviews ServiceAccount
#   kubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml -l app=reviews,version=v3 # reviews-v3 Deployment
##################################################################################################

##################################################################################################
# Details service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  namespace: appmesh-bookinfo
  name: details
  labels:
    app: details
    service: details
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: details
  

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: appmesh-bookinfo
  name: details-v1
  labels:
    app: details
    version: v1
spec:
  replicas: 10
  selector:
    matchLabels:
      app: details
      version: v1
  template:
    metadata:
      labels:
        app: details
        version: v1
    spec:
      serviceAccountName: appmesh-bookinfo
      containers:
      - name: details
        image: docker.io/istio/examples-bookinfo-details-v1:1.16.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
      nodeSelector:
        app: appmesh
      
---
##################################################################################################
# Ratings service
##################################################################################################
apiVersion: v1
kind: Service
metadata:
  namespace: appmesh-bookinfo
  name: ratings
  labels:
    app: ratings
    service: ratings
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: ratings
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: appmesh-bookinfo
  name: ratings-v1
  labels:
    app: ratings
    version: v1
spec:
  replicas: 10
  selector:
    matchLabels:
      app: ratings
      version: v1
  template:
    metadata:
      labels:
        app: ratings
        version: v1
    spec:
      serviceAccountName: appmesh-bookinfo
      containers:
      - name: ratings
        image: docker.io/istio/examples-bookinfo-ratings-v1:1.16.2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9080
        securityContext:
          runAsUser: 1000
      nodeSelector:
        app: appmesh
---
##################################################################################################
# Reviews service
##################################################################################################

apiVersion: v1
kind: Service
metadata:
  namespace: appmesh-bookinfo
  name: reviews
  labels:
    app: reviews
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: reviews
---
apiVersion: v1
kind: Service
metadata:
  namespace: appmesh-bookinfo
  name: reviews-v2
  labels:
    app: reviews-v2
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: reviews-v2
---
apiVersion: v1
kind: Service
metadata:
  namespace: appmesh-bookinfo
  name: reviews-v3
  labels:
    app: reviews-v3
spec:
  ports:
  - port: 9080
    name: http
  selector:
    app: reviews-v3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: appmesh-bookinfo
  name: reviews
  labels:
    app: reviews
spec:
  replicas: 10
  selector:
    matchLabels:
      app: reviews
  template:
    metadata:
      labels:
        app: reviews
    spec:
      serviceAccountName: appmesh-bookinfo
      containers:
      - name: reviews
        image: docker.io/istio/examples-bookinfo-reviews-v1:1.16.2
        imagePullPolicy: IfNotPresent
        env:
        - name: LOG_DIR
          value: "/tmp/logs"
        ports:
        - containerPort: 9080
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: wlp-output
          mountPath: /opt/ibm/wlp/output
        securityContext:
          runAsUser: 1000
      nodeSelector:
        app: appmesh
      volumes:
      - name: wlp-output
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: appmesh-bookinfo
  name: reviews-v2
  labels:
    app: reviews-v2
spec:
  replicas: 10
  selector:
    matchLabels:
      app: reviews-v2
  template:
    metadata:
      labels:
        app: reviews-v2
    spec:
      serviceAccountName: appmesh-bookinfo
