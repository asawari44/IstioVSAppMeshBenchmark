        - name: wlp-output
          mountPath: /opt/ibm/wlp/output
        securityContext:
          runAsUser: 1000
      nodeSelector:
        app: appmesh
      volumes:
      - name: wlp-output
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: appmesh-bookinfo
  name: reviews-v3
  labels:
    app: reviews-v3
spec:
  replicas: 10
  selector:
    matchLabels:
      app: reviews-v3
  template:
    metadata:
      labels:
        app: reviews-v3
    spec:
      serviceAccountName: appmesh-bookinfo
